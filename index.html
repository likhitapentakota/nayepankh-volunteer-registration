<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NayePankh Volunteer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>NayePankh Foundation</h1>

        <p class="description">
            Join NayePankh Foundation and help create positive social impact
            through volunteering, education, and community service.
        </p>

        <h2>Volunteer Registration Form</h2>

        <form id="volunteerForm">

            <input type="text" id="name" placeholder="Enter Name" required>

            <input type="email" id="email" placeholder="Enter Email" required>

            <input type="text" id="phone" placeholder="Enter Phone Number" required>

            <input type="text" id="skills" placeholder="Enter Skills" required>

            <button type="submit">
                Register
            </button>

        </form>

        <h3 id="count">
            Total Volunteers: 0
        </h3>

        <h3>Registered Volunteers</h3>

        <ul id="volunteerList"></ul>

        <footer>
            <p>Made by Likhita Pentakota</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
